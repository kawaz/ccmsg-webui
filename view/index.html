<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <!-- 起動の頁が自分に被せる CSP。ここに居るのは `boot.js` と、それが登録する
      `sw.js` だけ (DR-0005 §2.1)。外へ出る先も、読み込む先も、他に無い。
      描かれる文書に被せる CSP は SW が答えの側で付ける (`sw.ts`)。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; worker-src 'self'; frame-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>ccmsg view</title>
    <style>
      body {
        margin: 0;
        padding: 1rem;
        font:
          14px system-ui,
          sans-serif;
        color: #666;
        background: transparent;
      }
      /* 中身はこの頁いっぱい。起動の頁は器でしかないので、余白も持たない。 */
      body:has(.content) {
        padding: 0;
      }

      .content {
        display: block;
        width: 100%;
        height: 100vh;
        border: 0;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/boot.ts"></script>
  </body>
</html>
