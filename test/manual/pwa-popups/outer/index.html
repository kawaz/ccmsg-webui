<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="popup test" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>PWA sandbox test (outer)</title>
    <style>
      body {
        font:
          16px/1.5 -apple-system,
          system-ui,
          sans-serif;
        margin: 0;
        padding: env(safe-area-inset-top) 16px 16px;
      }
      h1 {
        font-size: 18px;
        margin: 8px 0;
      }
      .mode {
        padding: 8px 12px;
        border-radius: 8px;
        background: #eee;
        margin-bottom: 8px;
      }
      .mode.standalone {
        background: #cfe8cf;
      }
      .sets {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 8px 0;
      }
      .sets button {
        min-height: 44px;
        padding: 0 12px;
        border-radius: 8px;
        border: 2px solid #2a6ee0;
        background: #fff;
        color: #2a6ee0;
        font: inherit;
      }
      .sets button.on {
        background: #2a6ee0;
        color: #fff;
      }
      #attrs {
        font-family: ui-monospace, monospace;
        font-size: 13px;
        background: #f3f3f3;
        padding: 6px 10px;
        border-radius: 6px;
        word-break: break-all;
      }
      iframe {
        width: 100%;
        height: 560px;
        border: 3px solid #c60;
        border-radius: 8px;
        margin-top: 8px;
      }
      pre {
        background: #f6f6f6;
        padding: 8px;
        font-size: 12px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>outer (PWA 本体) <span id="origin"></span></h1>
    <div class="mode" id="mode"></div>
    <div class="mode" id="sw">SW: 未登録</div>
    <p>
      目的: 中身 (cross-site の iframe) から
      <b>この頁 (top) が書き換えられない</b>ことを保ちつつ、どこまで許せるか。sandbox
      のセットを選んでから、中の行を順に押す。結果は「S1-A = b」のようにセット名 + 行で答える。top
      が書き換わった時は着地頁がそれを表示する (戻るには PWA を開き直す)。
    </p>
    <p><a href="/csd.html">Clear-Site-Data の実験頁へ (SW が制御中の時に押す)</a></p>
    <div class="sets" id="sets"></div>
    <div id="attrs"></div>
    <iframe id="inner"></iframe>
    <pre id="log"></pre>
    <script src="/probe.js"></script>
    <script>
      // outer の SW が navigation の応答に COOP を足す (hosting の header は外してある)。
      const swBox = document.getElementById("sw");
      const showSw = () => {
        swBox.textContent = navigator.serviceWorker.controller
          ? "SW: この頁を制御中 (navigation の応答に COOP を足す)"
          : "SW: 登録したがまだ制御していない。頁を開き直す";
      };
      navigator.serviceWorker
        .register("/sw.js")
        .then(showSw)
        .catch((cause) => (swBox.textContent = `SW: 登録失敗 ${String(cause)}`));
      navigator.serviceWorker.addEventListener("controllerchange", showSw);
    </script>
    <script>
      const SETS = {
        S0: null,
        S1: "allow-scripts allow-same-origin allow-popups",
        S2: "allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox",
        S3: "allow-scripts allow-same-origin allow-popups allow-top-navigation-by-user-activation",
        S4: "allow-scripts allow-same-origin allow-popups allow-top-navigation",
        S5: "allow-scripts allow-same-origin",
      };
      const INNER = "https://pwa-test-inner.kawaz-mbp16-20211217.tmpspace.net/";
      const sets = document.getElementById("sets");
      const attrs = document.getElementById("attrs");
      const frame = document.getElementById("inner");
      function choose(name) {
        for (const b of sets.querySelectorAll("button"))
          b.classList.toggle("on", b.textContent === name);
        const value = SETS[name];
        const fresh = document.createElement("iframe");
        fresh.id = "inner";
        if (value !== null) fresh.setAttribute("sandbox", value);
        fresh.src = `${INNER}?set=${name}&outer=${encodeURIComponent(location.origin)}`;
        document.getElementById("inner").replaceWith(fresh);
        attrs.textContent =
          value === null ? `${name}: sandbox 属性なし` : `${name}: sandbox="${value}"`;
        try {
          localStorage.setItem("set", name);
        } catch {}
      }
      for (const name of Object.keys(SETS)) {
        const b = document.createElement("button");
        b.textContent = name;
        b.addEventListener("click", () => choose(name));
        sets.append(b);
      }
      let initial = "S1";
      try {
        initial = localStorage.getItem("set") ?? "S1";
      } catch {}
      choose(initial);
    </script>
  </body>
</html>
